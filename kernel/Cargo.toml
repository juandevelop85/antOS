# El kernel es su propio workspace, separado de la Vía A a propósito:
# se compila para x86_64-unknown-none, mientras que antosd y builder se
# compilan para el host. Mezclarlos obligaría a pasar --target en todo.
[workspace]

[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# Define el contrato entre el bootloader y nosotros: la estructura BootInfo
# (mapa de memoria, framebuffer, dirección física base...) y la macro
# entry_point!. Es no_std, así que se puede compilar para bare metal.
bootloader_api = "0.11"

# panic = "abort" es obligatorio: el "unwinding" de Rust necesita libunwind
# y tablas de excepciones que aquí no existen. Sin SO debajo, un panic no
# puede desenrollar la pila: solo puede parar la máquina.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = []
# Cambia el asignador global por el de puntero, para reproducir su defecto:
#   cargo build --features bump
bump = []
# Compila un punto de entrada distinto, enlazado en la mitad alta, que habla
# el protocolo de arranque de Limine en vez de la convención propia del
# crate `bootloader` (x86_64) o el arranque directo de QEMU sin bootloader
# (AArch64). Necesario para arrancar antos-uefi-{x86_64,aarch64}.img — la
# imagen UEFI que genera `builder` — en un firmware UEFI real (T27.1).
limine = []
