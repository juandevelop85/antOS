# antOS init process — the first userspace binary loaded by the kernel.
# Separate workspace: compiled to a static ELF for x86_64-unknown-none.
[workspace]

[package]
name = "antos-init"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "antos-init"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
