# NestJS: API HTTP en TypeScript (Express por debajo). La misma estructura que
# deja `nest new`, sin necesitar el CLI para crearla; el test de ejemplo es el
# `app.controller.spec.ts` canónico y pasa con `npm test` tras `npm install`.
id = "nestjs"
language = "typescript"
framework = "nestjs"
aliases = ["nest", "nestjs", "nest.js"]
summary = "API HTTP con NestJS (TypeScript, Express bajo el capó, Jest)"

[toolchain]
nix = ["nodejs_22"]
binaries = ["node", "npm"]

[commands]
install = ["npm", "install"]
test = ["npm", "test", "--silent"]
dev = ["npm", "run", "start:dev"]
build = ["npm", "run", "build"]
port = 3000

[network]
hosts = ["registry.npmjs.org"]

[[file]]
path = "package.json"
content = '''{
  "name": "{{name}}",
  "version": "0.1.0",
  "private": true,
  "scripts": {
    "build": "nest build",
    "start": "nest start",
    "start:dev": "nest start --watch",
    "start:prod": "node dist/main",
    "test": "jest",
    "test:watch": "jest --watch"
  },
  "dependencies": {
    "@nestjs/common": "^11.0.0",
    "@nestjs/core": "^11.0.0",
    "@nestjs/platform-express": "^11.0.0",
    "reflect-metadata": "^0.2.2",
    "rxjs": "^7.8.1"
  },
  "devDependencies": {
    "@nestjs/cli": "^11.0.0",
    "@nestjs/schematics": "^11.0.0",
    "@nestjs/testing": "^11.0.0",
    "@types/express": "^5.0.0",
    "@types/jest": "^29.5.14",
    "@types/node": "^22.10.0",
    "jest": "^29.7.0",
    "ts-jest": "^29.2.5",
    "ts-loader": "^9.5.1",
    "ts-node": "^10.9.2",
    "tsconfig-paths": "^4.2.0",
    "typescript": "^5.7.0"
  },
  "jest": {
    "moduleFileExtensions": ["js", "json", "ts"],
    "rootDir": "src",
    "testRegex": ".*\\.spec\\.ts$",
    "transform": { "^.+\\.(t|j)s$": "ts-jest" },
    "collectCoverageFrom": ["**/*.(t|j)s"],
    "coverageDirectory": "../coverage",
    "testEnvironment": "node",
    "watchman": false
  }
}
'''

[[file]]
path = "tsconfig.json"
content = '''{
  "compilerOptions": {
    "module": "commonjs",
    "declaration": true,
    "removeComments": true,
    "emitDecoratorMetadata": true,
    "experimentalDecorators": true,
    "allowSyntheticDefaultImports": true,
    "target": "ES2021",
    "sourceMap": true,
    "outDir": "./dist",
    "baseUrl": "./",
    "incremental": true,
    "skipLibCheck": true,
    "strictNullChecks": true,
    "forceConsistentCasingInFileNames": true
  }
}
'''

[[file]]
path = "tsconfig.build.json"
content = '''{
  "extends": "./tsconfig.json",
  "exclude": ["node_modules", "test", "dist", "**/*spec.ts"]
}
'''

[[file]]
path = "nest-cli.json"
content = '''{
  "$schema": "https://json.schemastore.org/nest-cli",
  "collection": "@nestjs/schematics",
  "sourceRoot": "src",
  "compilerOptions": {
    "deleteOutDir": true
  }
}
'''

[[file]]
path = ".gitignore"
content = '''node_modules/
dist/
coverage/
'''

[[file]]
path = "src/main.ts"
content = '''import { NestFactory } from '@nestjs/core';
import { AppModule } from './app.module';

async function bootstrap() {
  const app = await NestFactory.create(AppModule);
  await app.listen(process.env.PORT ?? 3000);
}
bootstrap();
'''

[[file]]
path = "src/app.module.ts"
content = '''import { Module } from '@nestjs/common';
import { AppController } from './app.controller';
import { AppService } from './app.service';

@Module({
  imports: [],
  controllers: [AppController],
  providers: [AppService],
})
export class AppModule {}
'''

[[file]]
path = "src/app.controller.ts"
content = '''import { Controller, Get } from '@nestjs/common';
import { AppService } from './app.service';

@Controller()
export class AppController {
  constructor(private readonly appService: AppService) {}

  @Get()
  getHello(): string {
    return this.appService.getHello();
  }

  @Get('health')
  getHealth(): { status: string } {
    return { status: 'ok' };
  }
}
'''

[[file]]
path = "src/app.service.ts"
content = '''import { Injectable } from '@nestjs/common';

@Injectable()
export class AppService {
  getHello(): string {
    return '{{name}} en marcha';
  }
}
'''

[[file]]
path = "src/app.controller.spec.ts"
content = '''import { Test, TestingModule } from '@nestjs/testing';
import { AppController } from './app.controller';
import { AppService } from './app.service';

describe('AppController', () => {
  let appController: AppController;

  beforeEach(async () => {
    const app: TestingModule = await Test.createTestingModule({
      controllers: [AppController],
      providers: [AppService],
    }).compile();

    appController = app.get<AppController>(AppController);
  });

  it('saluda con el nombre del proyecto', () => {
    expect(appController.getHello()).toBe('{{name}} en marcha');
  });

  it('responde en /health', () => {
    expect(appController.getHealth()).toEqual({ status: 'ok' });
  });
});
'''
