name = "env.service_down"
summary = "Detiene un servicio local arrancado por antOS (SIGTERM al proceso; los datos se conservan) o retira el registro de uno adoptado"

[params]
service = { type = "slug", max = 32 }

[effects]
writes = ["$STATE/services/{service}/"]

[policy]
tier = "confirm"
reversible = "never"
