name = "env.init"
summary = "Inicializa un perfil de entorno de desarrollo declarativo (devbox.json, flake.nix, .antos/env.toml)"

[params]
profile = { type = "text", optional = true }
devbox = { type = "text", optional = true, default = "true" }
flake = { type = "text", optional = true, default = "true" }

[effects]
writes = ["$WORKSPACE/devbox.json", "$WORKSPACE/flake.nix", "$WORKSPACE/.antos/env.toml"]

[policy]
tier = "confirm"
reversible = "snapshot"
