name = "secret.grant"
summary = "Concede acceso temporal explícito a un secreto o archivo sensible (.env, ssh)"

[params]
secret = { type = "slug", max = 32 }
minutes = { type = "slug", max = 8, optional = true, default = "10" }
reason = { type = "slug", max = 128, optional = true, default = "tarea de desarrollo" }

[effects]
writes = ["$STATE/grants.json"]

[policy]
tier = "grant"
reversible = "never"
