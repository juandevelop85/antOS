name = "project.run"
summary = "Ejecuta un comando declarado por el stack de un proyecto del workspace (install | test | verify | build) sin shell, dentro del recinto, con las cachés del gestor dentro del proyecto"

[params]
project = { type = "slug", max = 64 }
# `test` devuelve el resultado como texto (VERDE/ROJO) para que un agente
# pueda leerlo; `verify` es el mismo comando pero un rojo es un fallo del
# paso: es lo que cierra «crea un proyecto…» (T35.3).
command = { type = "enum", of = ["install", "test", "verify", "build"] }

[effects]
# Todo lo que el comando toca es artefacto de construcción (node_modules,
# target, .venv, package-lock, cachés en .antos/cache, log en .antos/logs):
# escribible en el recinto, ni confirmado como escritura ni fotografiado. Lo
# que se deshace es el andamio (`project.scaffold`), no una instalación.
scratch = ["$WORKSPACE/{project}/"]
# La red del recinto es todo o nada: esto la abre para el paso. El destino
# real lo declara el stack y lo muestra la previsualización («cambios»).
network = ["destino del stack (ver cambios)"]

[policy]
tier = "confirm"
# No hay estado que restaurar: todo lo que produce es artefacto declarado
# como `scratch`; deshacer el proyecto entero es deshacer `project.scaffold`.
reversible = "unnecessary"
# Un `npm install` o un `cargo fetch` no caben en los 120 s por defecto.
timeout_secs = 900
