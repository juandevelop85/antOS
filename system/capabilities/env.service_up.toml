name = "env.service_up"
summary = "Arranca (o adopta si ya escucha) un servicio local de desarrollo en 127.0.0.1: Ollama, PostgreSQL, Redis, Meilisearch"

[params]
service = { type = "slug", max = 32 }
port = { type = "slug", max = 8, optional = true }
db_name = { type = "slug", max = 32, optional = true, default = "antos_dev" }

[effects]
writes = ["$STATE/services/{service}/", "$WORKSPACE/.env"]
network = ["127.0.0.1"]

[policy]
tier = "confirm"
reversible = "snapshot"
