# Workspace propio: GTK4 y layer-shell solo existen en Linux con Wayland, así
# que este crate no puede formar parte del workspace que se compila en macOS.
[workspace]

[package]
name = "antos-barra"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "antos-barra"
path = "src/main.rs"

[dependencies]
# Los MISMOS tipos que habla el demonio, no una copia.
antos-protocol = { path = "../protocolo" }
serde_json = "1"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
# Icono de bandeja de sistema (StatusNotifierItem) para antos-barra —
# "blocking" + "async-io" en vez del "tokio" por defecto: no hace falta
# arrastrar un runtime async completo solo para publicar un icono.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

# gtk4 es enorme y compilarlo con información de depuración se comió los
# 1,9 GiB de la máquina de contenedores: rustc murió con SIGKILL. Sin
# debuginfo el pico de memoria baja lo suficiente.
[profile.dev]
debug = false
