[package]
name = "sysod"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "syso"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Rust no tiene SDK oficial de Anthropic, así que el planificador habla
# HTTP directo con la Messages API. ureq es bloqueante y sin runtime async:
# suficiente para un CLI y una dependencia mucho más ligera que reqwest.
ureq = { version = "3", features = ["json"] }
