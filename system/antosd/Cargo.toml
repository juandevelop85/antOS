[package]
name = "antosd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "antos"
path = "src/main.rs"

[dependencies]
# El contrato con los clientes. Vive fuera para que la barra de intención
# use exactamente los mismos tipos, no una copia.
antos-protocol = { path = "../protocolo" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Rust no tiene SDK oficial de Anthropic, así que el planificador habla
# HTTP directo con la Messages API. ureq es bloqueante y sin runtime async:
# suficiente para un CLI y una dependencia mucho más ligera que reqwest.
ureq = { version = "3", features = ["json"] }
libc = "0.2"
# Identidad criptográfica real de nodo y firma de tokens en antMesh (T31.5).
# Ed25519 no se implementa a mano: es exactamente la clase de primitiva
# —aritmética de curva elíptica sensible a tiempos de ejecución— donde una
# implementación casera es un riesgo, no un ahorro. `ed25519-dalek` es la
# biblioteca de referencia del ecosistema Rust para esta curva.
ed25519-dalek = "2"
# Cifrado en reposo de la bóveda de secretos (T31.6). AEAD auténtico, no un
# XOR casero: ChaCha20-Poly1305 es la cifra de referencia del ecosistema
# RustCrypto, sin dependencias de aceleración de hardware específicas de
# plataforma (a diferencia de AES-GCM sin soporte AES-NI).
chacha20poly1305 = "0.10"
# Higiene de memoria de secretos (T31.6): borra el búfer de un valor en
# cuanto se suelta, en vez de confiar en que nadie más lo lea antes de que
# el asignador reutilice esa memoria.
zeroize = "1"
