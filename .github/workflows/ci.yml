# antOS · CI/CD Pipeline (T22.6)
#
# Validates every commit and pull request across the full matrix:
# - Host workspace (antosd, protocolo, builder) on Linux and macOS
# - Kernel bare-metal cross-compilation for x86_64 and AArch64
# - Code quality: rustfmt, clippy with zero warnings
#
# The kernel is a separate workspace targeting x86_64-unknown-none and
# aarch64-unknown-none, so it gets its own compilation jobs.

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────── Code formatting
  check-format:
    name: "Format · rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting (host workspace)
        run: cargo fmt --all -- --check

      - name: Check formatting (kernel workspace)
        run: cargo fmt --all -- --check
        working-directory: kernel

      - name: Check formatting (user workspace)
        run: cargo fmt --all -- --check
        working-directory: user

      # T31.10: `system/barra` is its own workspace but is NOT a member (nor
      # excluded) in the root Cargo.toml, and antos-protocol — a member of
      # the root workspace — is one of its path dependencies. `cargo fmt
      # --all` run with `working-directory: system/barra` (the pattern used
      # above for kernel/user) resolves through that path dependency into
      # the *root* workspace and reformats antosd/builder/protocolo instead
      # of just barra — reproduced locally, `cargo metadata`/
      # `cargo locate-project` from that directory correctly report barra as
      # self-contained, so this is specific to how `cargo-fmt` enumerates
      # `--all` packages, not a real workspace ambiguity. `--manifest-path`
      # from the repo root does not exhibit the leak and is what
      # `check-format` uses instead.
      - name: Check formatting (system/barra)
        run: cargo fmt --manifest-path system/barra/Cargo.toml -- --check

  # ──────────────────────────────────────────────── Clippy lint (host)
  clippy-host:
    name: "Lint · clippy (host)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: clippy-host-${{ runner.os }}-

      - name: Clippy (host workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # T31.7: antosd's own crate-level `#![deny(clippy::unwrap_used,
      # clippy::expect_used)]` (main.rs) already gates this locally, but a
      # dedicated CI step means a regression fails here even if that
      # `#![deny]` were ever weakened or removed by accident. Scoped to
      # antosd — protocolo and builder aren't part of this ticket's audit
      # and aren't expected to pass this stricter bar yet.
      - name: Clippy (antosd · no unwrap()/expect() outside tests, T31.7)
        run: cargo clippy -p antosd --all-targets -- -D clippy::unwrap_used -D clippy::expect_used

  # ──────────────────────────────────────────────── Test on Linux
  test-linux:
    name: "Test · Linux (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-system-arm

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-linux-

      - name: Build host workspace
        run: cargo check --workspace

      - name: Run host workspace tests
        run: cargo test --workspace

      # T34.1: los servicios efímeros arrancan procesos reales. Estos tests
      # van `#[ignore]` porque necesitan los binarios; aquí se instalan
      # (Debian deja `postgres`/`initdb` en /usr/lib/postgresql/<v>/bin, fuera
      # de PATH: el backend `System` los busca ahí) y se ejecutan de verdad.
      # El demonio de postgres del paquete se para para que no sea él quien
      # escuche en 5432 y el test adopte en vez de arrancar.
      - name: Install real services for the ephemeral-service tests
        run: |
          sudo apt-get install -y --no-install-recommends redis-server postgresql
          sudo systemctl stop redis-server postgresql || true
          sudo systemctl disable redis-server postgresql || true

      - name: Ephemeral services · real Redis and PostgreSQL round trips
        run: cargo test -p antosd -- --ignored real_redis_roundtrip real_postgres_roundtrip

      # T35.2: andamio + `npm install` + `npm test` del stack `express`, en
      # proceso (el runner trae node/npm). El mismo flujo por el recinto
      # Landlock, con el binario real, va en el job `antos-linux-desktop`.
      - name: Projects · scaffold + install + test (express, in-process)
        run: cargo test -p antosd -- --ignored real_express_scaffold_install_and_test

  # ──────────────────────────────────────────────── Test on macOS
  test-macos:
    name: "Test · macOS (Apple Silicon)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-macos-

      - name: Build host workspace
        run: cargo check --workspace

      - name: Run host workspace tests
        run: cargo test --workspace

  # ──────────────────────────────────────────────── Kernel · x86_64
  kernel-x86_64:
    name: "Kernel · x86_64-unknown-none"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            user/target
          key: kernel-x86-${{ hashFiles('kernel/Cargo.lock', 'user/Cargo.lock') }}
          restore-keys: kernel-x86-

      - name: Build kernel (x86_64 bare-metal)
        run: cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none

  # ──────────────────────────────────────────────── Kernel · AArch64
  kernel-aarch64:
    name: "Kernel · aarch64-unknown-none"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, aarch64-unknown-none

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            user/target
          key: kernel-aarch64-${{ hashFiles('kernel/Cargo.lock', 'user/Cargo.lock') }}
          restore-keys: kernel-aarch64-

      - name: Build kernel (AArch64 bare-metal)
        run: cargo build --manifest-path kernel/Cargo.toml --target aarch64-unknown-none

  # ──────────────────────────────────────────────── Kernel · Clippy
  clippy-kernel:
    name: "Lint · clippy (kernel)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            user/target
          key: clippy-kernel-${{ hashFiles('kernel/Cargo.lock', 'user/Cargo.lock') }}
          restore-keys: clippy-kernel-

      - name: Clippy (kernel, x86_64 bare-metal)
        run: cargo clippy --manifest-path kernel/Cargo.toml --target x86_64-unknown-none -- -D warnings

      # T31.10: `user/` (antos-init + libantos) had no clippy coverage at
      # all — only the fmt step above touched it. Shares this job's
      # toolchain (rust-src for building core/alloc from source) rather than
      # clippy-host's, since user/ is also a `no_std` bare-metal target.
      # `--target` is explicit rather than relying on `user/.cargo/config.toml`:
      # Cargo's config-file discovery walks up from the current *directory*,
      # not from `--manifest-path`, so invoking this from the repo root
      # without an explicit `--target` silently falls back to the host
      # triple instead of `x86_64-unknown-none` (reproduced locally — it
      # still "compiles", but lints a different, wrong build). `--all-targets`
      # is deliberately omitted: it hits the same missing `test` crate gap
      # T31.16 exists to close for the kernel.
      - name: Clippy (user workspace, x86_64 bare-metal)
        run: cargo clippy --manifest-path user/Cargo.toml --target x86_64-unknown-none -- -D warnings

  # ──────────────────────────────────────────────── Kernel · tests (T31.16)
  # No hay crate `test` para *-unknown-none (depende de `std`), así que
  # `cargo test` normal nunca compilaba — 98 `#[test_case]` (antes
  # `#[test]`, sin arnés) escritos y nunca ejecutados. `kernel/src/
  # test_framework.rs` implementa el arnés canónico de un kernel Rust
  # (`custom_test_frameworks` + `test_runner` + `reexport_test_harness_main`)
  # y cada arquitectura arranca en su emulador real de QEMU en vez de
  # simularlo: `kernel/run-tests-x86_64.sh` empaqueta una imagen BIOS con el
  # `builder` del workspace (igual que `run.sh`); `kernel/run-tests-
  # aarch64.sh` arranca el ELF crudo vía `-M virt -kernel` (igual que
  # `system/run-arm.sh`). Ambos vigilan la salida serie con el mismo arnés
  # Python de T28.10 (`system/qemu-smoke.py`) buscando `KERNEL_TEST_RESULT:
  # PASS`; un test que entra en pánico (`panic = "abort"`, sin arnés que lo
  # capture y siga con el siguiente) hace que el kernel imprima
  # `KERNEL_TEST_RESULT: FAIL` en su lugar, y ese banner nunca coincide con
  # `PASS`, así que el trabajo falla igual de claro.
  kernel-tests:
    name: "Kernel · tests (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  target: x86_64-unknown-none,  script: kernel/run-tests-x86_64.sh }
          - { arch: aarch64, target: aarch64-unknown-none, script: kernel/run-tests-aarch64.sh }
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: ${{ matrix.target }}

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            target
          key: kernel-tests-${{ matrix.arch }}-${{ hashFiles('kernel/Cargo.lock') }}
          restore-keys: kernel-tests-${{ matrix.arch }}-

      - name: Run kernel tests in QEMU
        run: ${{ matrix.script }}

  # ──────────────────────────────────── Nomenclatura · identificadores en inglés
  # T31.12: heurística que busca lexemas españoles en declaraciones (`fn`,
  # `let`, `struct`, `enum`, `const`, `static`, `mod`) — nunca dentro de
  # comentarios, strings ni de un `mod tests { ... }` (los nombres de test
  # siguen una convención propia y aparte, ya extendida por todo el árbol).
  # No es un lint perfecto: un cognado inglés/español nuevo puede dar un
  # falso positivo, así que un fallo aquí pide revisar el hallazgo, no
  # asumir que está mal — ver el docstring del propio script.
  check-english-identifiers:
    name: "Nomenclatura · identificadores en inglés"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Spanish identifiers in declarations
        run: python3 .agents/scripts/check-spanish-identifiers.py system/ kernel/ builder/ user/

  # ──────────────────────────────────────────────── Builder validation
  builder-tests:
    name: "Builder · GPT/EFI image tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache builder build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: builder-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: builder-

      - name: Run builder tests
        run: cargo test -p builder

  # ──────────────────────── Peripheral emulation matrix (T28.10)
  # Boots the kernel headless for each transport combination and injects
  # keyboard + mouse events over the QEMU monitor, requiring the kernel to
  # acknowledge them ("input-rx:" on the serial log).
  peripheral-smoke:
    name: "Periféricos · ${{ matrix.arch }} kbd=${{ matrix.kbd }} gpu=${{ matrix.gpu }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  target: x86_64-unknown-none,  kbd: ps2, gpu: std,        script: "./run.sh" }
          - { arch: x86_64,  target: x86_64-unknown-none,  kbd: usb, gpu: std,        script: "./run.sh" }
          - { arch: aarch64, target: aarch64-unknown-none, kbd: virtio, gpu: virtio-mmio, script: "system/run-arm.sh" }
          - { arch: aarch64, target: aarch64-unknown-none, kbd: virtio, gpu: ramfb,       script: "system/run-arm.sh" }
          - { arch: aarch64, target: aarch64-unknown-none, kbd: usb,    gpu: virtio-mmio, script: "system/run-arm.sh" }
          - { arch: aarch64, target: aarch64-unknown-none, kbd: usb,    gpu: ramfb,       script: "system/run-arm.sh" }
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, aarch64-unknown-none

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm

      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            user/target
            target
          key: smoke-${{ matrix.arch }}-${{ hashFiles('kernel/Cargo.lock', 'user/Cargo.lock') }}
          restore-keys: smoke-${{ matrix.arch }}-

      - name: Input-injection smoke test
        run: ${{ matrix.script }} --test-input --kbd ${{ matrix.kbd }} --gpu ${{ matrix.gpu }}

  # ──────────────────────── Escritorio antOS Linux · smoke headless (T30.4)
  # Arranca un compositor wlroots sin pantalla + antosd + antos-barra y
  # verifica: global zwlr_layer_shell_v1, socket IPC vivo, barra en pie y una
  # captura `grim` no vacía. El detalle está en system/desktop/smoke.sh.
  antos-linux-desktop:
    name: "Escritorio antOS Linux · smoke headless"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Wayland desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            labwc grim wayland-utils \
            libgtk-4-dev libgtk4-layer-shell-dev \
            pkg-config

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            system/barra/target
          key: desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: desktop-

      - name: Build antos (daemon/CLI) and antos-barra
        run: |
          cargo build -p antosd --release
          cargo build --manifest-path system/barra/Cargo.toml --release

      - name: Headless desktop smoke
        run: |
          export ANTOS_BIN="$PWD/target/release/antos"
          export ANTOS_BARRA_BIN="$PWD/system/barra/target/release/antos-barra"
          bash system/desktop/smoke.sh

      # T33.5: evaluación determinista de agentes con el binario real y el
      # ejecutor confinado (Landlock aquí). Los casos viven en evals/agent/;
      # el proveedor es `fake` (sin red ni clave). `--live` nunca en CI.
      - name: Deterministic agent evaluation
        run: |
          export ANTOS_STATE="$(mktemp -d)"
          "$PWD/target/release/antos" eval agent

      # T35.2: «crea un proyecto en express llamado shop» de punta a punta
      # con el binario real y el recinto Landlock: andamio, `npm install`
      # (red abierta para el paso; caché de npm dentro del proyecto) y
      # «prueba el proyecto shop». Si Landlock deniega algo (HOME, cachés,
      # temporales) se ve aquí y no en la máquina de un usuario.
      - name: Projects · scaffold + install + test under Landlock (express)
        run: |
          export ANTOS_STATE="$(mktemp -d)"
          export ANTOS_WORKSPACE="$(mktemp -d)"
          ANTOS="$PWD/target/release/antos"
          "$ANTOS" --planner local -y "crea un proyecto en express llamado shop"
          test -d "$ANTOS_WORKSPACE/shop/node_modules/express"
          test -d "$ANTOS_WORKSPACE/shop/.antos/cache/npm"
          test ! -d "$HOME/.npm/_cacache" || echo "aviso: ~/.npm/_cacache existe (¿de otro paso?)"
          "$ANTOS" --planner local -y "prueba el proyecto shop" | tee /tmp/shop-test.txt
          grep -q "TESTS EN VERDE" /tmp/shop-test.txt

  # ──────────────────────────────────────────────── Lint · clippy (barra)
  # T31.10: `system/barra` had no quality gate at all beyond compiling in
  # the desktop-smoke job above (and without -D warnings there). GTK4/
  # gtk4-layer-shell only exist on Linux with Wayland — this crate cannot be
  # built, let alone linted, on macOS (confirmed locally: pkg-config can't
  # find gtk4 or gtk4-layer-shell on Homebrew), so this runs only here, on
  # the Linux runner that already installs those headers for the desktop
  # smoke job.
  # T31.13 adds a `cargo test` step below: `main.rs` gained a handful of
  # unit tests for the logic that doesn't touch GTK. Kept in this same job
  # (not a new one) since it needs the identical GTK4 toolchain to compile.
  clippy-barra:
    name: "Lint · clippy (system/barra)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain with clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install GTK4 / layer-shell dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgtk4-layer-shell-dev \
            pkg-config

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            system/barra/target
          key: clippy-barra-${{ hashFiles('system/barra/Cargo.lock') }}
          restore-keys: clippy-barra-

      - name: Clippy (system/barra)
        run: cargo clippy --manifest-path system/barra/Cargo.toml -- -D warnings

      # T31.13: the pure, non-GTK logic in `main.rs` (event/state formatting
      # helpers like `truncate_str`, `level_css_class`) now has unit tests.
      # They still live in the same binary crate as the GTK4 UI code, so
      # `cargo test` here still needs to *compile* the whole crate (headers
      # installed above) even though the tests themselves never touch GTK.
      - name: Test (system/barra)
        run: cargo test --manifest-path system/barra/Cargo.toml

  # ──────────────────────────────────────────────── Nix · build del flake
  # T31.19: la CI compilaba el workspace del anfitrión con `cargo` y el árbol
  # entero disponible, pero NADA construía por Nix. Por eso T31.17 (barra que
  # no enlazaba, `fileset` de `package.nix` sin `recipes/`) y T31.18 pasaron
  # sin que la CI dijera nada. `cache.nixos.org` sirve prehecho casi todo, así
  # que este job descarga mucho pero compila poco (solo las derivaciones
  # propias de antOS).
  nix-build:
    name: "Nix · build del flake"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco del runner
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup || true
          df -h /

      - name: Instalar Nix (nix-command + flakes)
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check (evaluación)
        run: nix flake check --no-build --show-trace

      # T34.3: el escritorio trae Ollama de serie y SOLO en loopback; la
      # máquina headless y la ISO no lo traen. Se comprueba por evaluación,
      # sin construir: si alguien abre el puerto o lo quita del escritorio,
      # este paso lo dice.
      - name: Motor local de serie (services.antos.llm) · aserciones
        run: |
          set -eu
          # `--json` para que booleanos, enteros y cadenas salgan sin ambigüedad.
          eval_cfg() { nix eval --json ".#nixosConfigurations.$1.config.$2"; }
          test "$(eval_cfg antos-desktop services.ollama.enable)" = "true"
          test "$(eval_cfg antos-desktop services.ollama.host)" = '"127.0.0.1"'
          test "$(eval_cfg antos-desktop services.ollama.port)" = "11434"
          test "$(eval_cfg antos-desktop-vm services.ollama.enable)" = "true"
          test "$(eval_cfg antos-vm services.ollama.enable)" = "false"
          test "$(eval_cfg antos-iso services.ollama.enable)" = "false"
          # Sin modelos en la activación: la descarga es del usuario.
          test "$(eval_cfg antos-desktop services.ollama.loadModels)" = "[]"
          echo "services.antos.llm: escritorio sí (127.0.0.1:11434, sin modelos), headless e ISO no"

      - name: Build · antosd
        run: nix build .#antosd --print-build-logs

      # T36.1: el `/etc/nixos/flake.nix` que escribe `antos install` tiene
      # que evaluar contra el árbol real de antOS. Antes referenciaba
      # `paquete.nix` (renombrado en T31.12), no importaba el módulo `llm` y
      # fijaba `x86_64-linux`, y nada lo detectaba porque solo se comprobaba
      # con `contains()` sobre cadenas. Aquí se genera con el binario recién
      # construido (simulación: el disco no se toca) y se evalúa el
      # `toplevel` de la máquina resultante con `nix eval`, apuntando la
      # entrada `antos` a la copia del árbol que el propio instalador dejó
      # junto al flake (`/etc/nixos/antos` en una instalación real).
      - name: Instalador · el flake generado evalúa (T36.1)
        run: |
          set -eu
          export ANTOS_WORKSPACE="$PWD" ANTOS_STATE="$RUNNER_TEMP/antos-state" ANTOS_SOURCE="$PWD"
          ./result/bin/antos install --target /dev/nvme0n1 --clean
          gen="$PWD/target/installer-staging/etc/nixos"
          test -f "$gen/flake.nix" && test -f "$gen/flake.lock" && test -f "$gen/antos/flake.nix"
          # El nixpkgs del flake generado es el mismo rev que el de este árbol.
          rev="$(jq -r .nodes.nixpkgs.locked.rev flake.lock)"
          grep -q "github:NixOS/nixpkgs/$rev" "$gen/flake.nix"
          # `antos-box` es el hostname del modo directo (`--target`).
          nix eval --raw --no-write-lock-file \
            --override-input antos "path:$gen/antos" \
            "path:$gen#nixosConfigurations.antos-box.config.system.build.toplevel.drvPath"
          echo
          echo "flake generado por antos install: nixosConfigurations.antos-box evalúa"

      - name: Build · antos-barra
        run: nix build .#antos-barra --print-build-logs

      - name: Build · sistema NixOS headless (antos-vm)
        run: nix build .#nixosConfigurations.antos-vm.config.system.build.toplevel --print-build-logs

      - name: Build · sistema con escritorio (antos-desktop-vm)
        run: nix build .#nixosConfigurations.antos-desktop-vm.config.system.build.toplevel --print-build-logs
